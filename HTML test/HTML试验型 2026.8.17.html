<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS导入方式</title>
    <link rel="stylesheet" href="./css专属文件夹/style.css">
    <br>
<style>
        p{color:aquamarine;
        font-size: 25px;
        }
        h2{color:blue;
        font-size: 25px;
        }
</style>
</head>
<body>
    <p>这是一个标签<a href="https://www.example.com">链接</a></p>
    <h1 style="color: red; font-size: 30px;">这是一个一级标签,使用内联样式</h1>
    <h2>这是一个二级标签，使用内部样式</h2>
    <h3>这是一个三级标签，使用外部样式</h3>
</body>
</html>
