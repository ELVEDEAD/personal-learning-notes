<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS选择器</title>
    <style>
        /*元素选择器*/
        h2{color: blue;
        font-size: 25px;
        }
        /*类选择器*/
        .highlight{color: green;background-color: yellow;
        font-size: 20px;}
        /*ID选择器*/
        #unique-id{color: red;
        font-size: 20px;}
        /*通用选择器*/
        *{font-family: KaiTi, sans-serif;}
        /*子元素选择器*/
        .father .son{color: purple;
        font-size: 18px;}
        /*后代元素选择器*/
        .father div p{color: orange;
        font-size: 16px;}
        /*相邻兄弟选择器*/
        h3 + p{color: brown;}
        /*伪类选择器*/
        #element:hover{background-color: pink}
    </style>
</head>
<body>
    <h1>不同类型的CSS选择器</h1>
    <h2>这是一个元素选择器示例</h2>
    <h3 class="highlight">这是一个类选择器示例</h3>
    <h3>这是一个选择器示例</h3>
    <h4 class="highlight">这是一个类选择器示例</h4>
    <h4 id="unique-id">这是一个ID选择器示例</h4>
    <br>
    <div class="father">
        <p class="son">这是一个子元素选择器示例</p>
        <div>
        <p class="grandson">这是一个后代元素选择器示例</p>
        </div>
    </div>
    <p>这是一个普通的p标签示例</p>
    <h3>这是一个相邻兄弟选择器示例</h3>
    <p>这是另一个普通的p标签示例</p>
    <h2 id="element">这是一个伪类选择器示例</h2>
</body>
</html>
